name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2025
            name: Windows
          - os: ubuntu-24.04
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Run native app tests
        if: runner.os != 'Linux'
        run: npm run test:app

      - name: Run native app tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app
