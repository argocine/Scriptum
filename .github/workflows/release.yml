# Build installers for every platform and attach them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     npm version 1.1.0        # use the exact version already prepared and tested
#     git push --follow-tags
#
# Runs on GitHub's free tier for public repositories. No secrets are required
# for a free build without a paid publisher certificate; see the signing note
# at the bottom of the file.

name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Validate release metadata
        run: node tools/validate-release.mjs

      - name: Require the release commit to be on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2025
            name: Windows
          - os: ubuntu-24.04
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Run native app tests
        if: runner.os != 'Linux'
        run: npm run test:app

      - name: Run native app tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # macOS uses the explicit ad-hoc identity in package.json. Disabling
          # discovery keeps this free build from searching for paid signing
          # certificates. See the note below about signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged application
        run: npm run verify:package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read # download artifacts produced by the build matrix
      artifact-metadata: write # link build subjects when the repository supports it
      attestations: write # publish signed Sigstore/SLSA provenance
      contents: write # create the release and upload its assets
      id-token: write # obtain the short-lived signing identity
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum */* | sed -E 's#  [^/]+/#  #' > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/SHA256SUMS.txt
          create-storage-record: false

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download the file for your machine:

            - **Mac (Apple Silicon)** — `Scriptum-*-arm64.dmg`
            - **Mac (Intel)** — `Scriptum-*-x64.dmg`
            - **Mac (portable archives)** — `Scriptum-*-arm64.zip` or `Scriptum-*-x64.zip`
            - **Windows (64-bit Intel/AMD)** — `Scriptum-Setup-*-x64.exe`
            - **Linux (64-bit Intel/AMD)** — `Scriptum-*-x64.AppImage` or `Scriptum-*-x64.deb`

            SHA-256 hashes for every download are in `SHA256SUMS.txt`.
            GitHub also publishes a signed build-provenance attestation for
            every artifact; verify one with `gh attestation verify FILE --repo argocine/Scriptum`.

            These builds do not have a paid, publicly trusted publisher
            signature, so the first launch needs one extra step. See
            "Installing" in the README.
# ---------------------------------------------------------------------------
# Code signing
#
# Builds without a trusted publisher signature work, but the first launch
# shows a security warning on macOS and Windows. Removing that warning costs
# money:
#
#   macOS   Apple Developer Program, $99/year. Add the certificate as the
#           CSC_LINK and CSC_KEY_PASSWORD secrets, remove `identity: "-"`
#           from package.json, set
#           CSC_IDENTITY_AUTO_DISCOVERY back to true, and add
#           APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to notarize.
#
#   Windows OV or EV code-signing certificate, roughly $100-400/year. Add it
#           as CSC_LINK and CSC_KEY_PASSWORD.
#
# Linux needs neither.
# ---------------------------------------------------------------------------
