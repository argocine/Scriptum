# Build installers for every platform and attach them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     npm version minor        # bumps package.json and creates the tag
#     git push --follow-tags
#
# Runs on GitHub's free tier for public repositories. No secrets are required
# for a free build without a paid publisher certificate; see the signing note
# at the bottom of the file.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run native app tests
        if: runner.os != 'Linux'
        run: npm run test:app

      - name: Run native app tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # macOS uses the explicit ad-hoc identity in package.json. Disabling
          # discovery keeps this free build from searching for paid signing
          # certificates. See the note below about signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read # download artifacts produced by the build matrix
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum */* | sed -E 's#  [^/]+/#  #' > SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Download the file for your machine:

            - **Mac (Apple Silicon)** — `Scriptum-*-arm64.dmg`
            - **Mac (Intel)** — `Scriptum-*-x64.dmg`
            - **Windows** — `Scriptum-Setup-*.exe`
            - **Linux** — `Scriptum-*.AppImage`

            SHA-256 hashes for every download are in `SHA256SUMS.txt`.

            These builds do not have a paid, publicly trusted publisher
            signature, so the first launch needs one extra step. See
            "Installing" in the README.
# ---------------------------------------------------------------------------
# Code signing
#
# Builds without a trusted publisher signature work, but the first launch
# shows a security warning on macOS and Windows. Removing that warning costs
# money:
#
#   macOS   Apple Developer Program, $99/year. Add the certificate as the
#           CSC_LINK and CSC_KEY_PASSWORD secrets, remove `identity: "-"`
#           from package.json, set
#           CSC_IDENTITY_AUTO_DISCOVERY back to true, and add
#           APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to notarize.
#
#   Windows OV or EV code-signing certificate, roughly $100-400/year. Add it
#           as CSC_LINK and CSC_KEY_PASSWORD.
#
# Linux needs neither.
# ---------------------------------------------------------------------------
